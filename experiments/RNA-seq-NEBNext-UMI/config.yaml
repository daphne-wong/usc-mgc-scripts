# Configuration file for the RNA-seq UMI pipeline

# Input directory containing the raw FASTQ files.
# These files are expected to be in a structure that allows Snakemake to find them
# using the glob pattern defined in count_NEB_RNA1.smk.
input_dir: "/project2/weisenbe_1344/MGC/RNA-Seq/El-Khoueiry_QingruFeng_Novaseq_20250724/fastqs"

# Output directory where all intermediate and final results will be stored.
out_dir: "/project2/weisenbe_1344/MGC/RNA-Seq/El-Khoueiry_QingruFeng_Novaseq_20250724/run2/results"

# Path to the reference genome FASTA file.
# Example: "/path/to/references/Homo_sapiens.GRCh38.dna.primary_assembly.fa"
genome: "/project2/weisenbe_1344/MGC/resources/singlecell/refdata-gex-GRCh38-2024-A/fasta/genome.fa"

# Path to the GTF annotation file.
# This is used for gene counting and TPM calculation.
# Example: "/path/to/references/Homo_sapiens.GRCh38.109.gtf"
gtf: "/project2/weisenbe_1344/MGC/resources/singlecell/refdata-gex-GRCh38-2024-A/genes/genes.gtf.gz"

# Path to the directory containing the STAR genome index.
# This directory should contain files like SA, SAindex, genome, etc., generated by STAR.
# Example: "/path/to/star_index/GRCh38_STAR_index"
star_index: "/project2/weisenbe_1344/MGC/resources/singlecell/refdata-gex-GRCh38-2024-A/star"

# Strandedness of the RNA-seq library.
# 0: unstranded
# 1: stranded
# 2: reversely stranded (common for Illumina TruSeq, NEBNext Ultra II Directional)
# The default in the Snakemake file is '2'.
stranded: 2
