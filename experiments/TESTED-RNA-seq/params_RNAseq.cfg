# ===============================================================
# RNA-SEQ (MISEQ) CONFIG FILE
# This is to run RNA sequencing analysis.
# ===============================================================


# ================= (1) Path to samplesheet and output directory ============================================
# Path to samplesheet.csv and output directory

# Samplesheet should be in CSV format accoridng to nf-core/rnaseq format. 
# See: https://nf-co.re/rnaseq/3.26.0/docs/usage/#full-samplesheet
# example: SAMPLESHEET="/project2/weisenbe_1344/MGC/RNA-Seq/Siletz_20250902/samplesheet.csv"
SAMPLESHEET=""

# Output directory for results
# example: OUT_DIR="/project2/weisenbe_1344/MGC/RNA-Seq/Siletz_20250902/run1"
OUT_DIR=""


# ================= (2) Path to reference genome files =====================
# Check if human or mouse, and make sure the correct one is NOT commented out
# Both FASTA `.fa` and GTF `.gtf` files are required
# Default = GRCh38/hg38 Human Reference

# Human reference:
REF_FA="/project2/tp_612_1653/resources/RNA-seq/GENCODE_v44/GRCh38.primary_assembly.genome.fa"
REF_GTF="/project2/tp_612_1653/resources/RNA-seq/GENCODE_v44/gencode.v44.primary_assembly.annotation.gtf"

# Mouse reference:
#REF_FA="/project2/tp_612_1653/resources/RNA-seq/GRCm39.primary_assembly.genome.fa"
#REF_GTF="/project2/tp_612_1653/resources/RNA-seq/gencode.vM33.primary_assembly.annotation.gtf"


# ================= (3) Other options ================================
# Keep as default unless otherwise instructed
trimmer="fastp"
min_trimmed_reads=10